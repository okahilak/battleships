# Linker config for a PSID file: 124-byte header, load address, then the
# player at $1000 (init = $1000, play = $1003).
MEMORY {
    HEADER: file = %O, start = $0000, size = $007e, fill = yes;
    MAIN:   file = %O, start = $1000, size = $2000;
}
SEGMENTS {
    SIDHEADER: load = HEADER, type = ro;
    SIDJMP:    load = MAIN,   type = ro;
    CODE:      load = MAIN,   type = ro;
    RODATA:    load = MAIN,   type = ro;
    BSS:       load = MAIN,   type = rw;     # stored in the file so SID players reserve it
}

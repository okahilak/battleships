# Keyboard -> joystick mapping for two players (loaded with x64sc -addconfig).
# Values are GDK key codes. Keyset 1 drives port 2, keyset 2 drives port 1 (see Makefile).
[C64SC]
KeySetEnable=1
# Player 1 (port 2): W A S D + Space
KeySet1North=119
KeySet1West=97
KeySet1South=115
KeySet1East=100
KeySet1Fire=32
# Player 2 (port 1): I J K L + Return
KeySet2North=105
KeySet2West=106
KeySet2South=107
KeySet2East=108
KeySet2Fire=65293
